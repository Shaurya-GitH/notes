<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="t">
  <title id="t">How the assistant answers: the website, the Echo agent, the store APIs and the evaluator</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6fb3bd"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e8c06a"/>
    </marker>
  </defs>
  <rect width="600" height="660" rx="18" fill="#071f3d"/>
  <g font-family="Georgia, 'Iowan Old Style', serif" fill="#f2ead8">
    <!-- website -->
    <rect x="24" y="24" width="250" height="320" rx="14" fill="none" stroke="#6fb3bd" stroke-width="2"/>
    <text x="44" y="62" font-size="26">Website</text>
    <text x="44" y="92" font-size="18" fill="#b9b29a">page, cart, sections read,</text>
    <text x="44" y="114" font-size="18" fill="#b9b29a">shopper group</text>
    <rect x="44" y="140" width="210" height="72" rx="10" fill="#0d2c52" stroke="#e8c06a" stroke-width="1.5"/>
    <text x="60" y="171" font-size="20">Cards</text>
    <text x="60" y="197" font-size="17" fill="#b9b29a">figures from the store</text>
    <rect x="44" y="230" width="210" height="94" rx="10" fill="#0d2c52" stroke="#e8c06a" stroke-width="1.5"/>
    <text x="60" y="261" font-size="20">Page actions</text>
    <text x="60" y="287" font-size="17" fill="#b9b29a">named sections only;</text>
    <text x="60" y="309" font-size="17" fill="#b9b29a">the result goes back</text>

    <!-- agent -->
    <rect x="336" y="24" width="240" height="130" rx="14" fill="none" stroke="#6fb3bd" stroke-width="2"/>
    <text x="356" y="62" font-size="26">Echo agent</text>
    <text x="356" y="92" font-size="18" fill="#b9b29a">prompt, voice in and out,</text>
    <text x="356" y="114" font-size="18" fill="#b9b29a">what the shopper said</text>

    <!-- store -->
    <rect x="336" y="250" width="240" height="130" rx="14" fill="none" stroke="#6fb3bd" stroke-width="2"/>
    <text x="356" y="288" font-size="26">Store APIs</text>
    <text x="356" y="318" font-size="18" fill="#b9b29a">product record, stock,</text>
    <text x="356" y="340" font-size="18" fill="#b9b29a">delivery for a ZIP</text>

    <!-- evaluator -->
    <rect x="24" y="500" width="552" height="130" rx="14" fill="none" stroke="#6fb3bd" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="44" y="538" font-size="26">Evaluator <tspan font-size="18" fill="#b9b29a">(ops backend, staging)</tspan></text>
    <text x="44" y="570" font-size="18" fill="#b9b29a">a verdict for each shopper question, checked</text>
    <text x="44" y="592" font-size="18" fill="#b9b29a">against product data fetched at that moment</text>
  </g>

  <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="16" fill="#6fb3bd" stroke-width="2" stroke-linecap="round">
    <!-- website to agent: question + context -->
    <path d="M274 64H330" stroke="#6fb3bd" fill="none" marker-end="url(#a)"/>
    <text x="280" y="50" fill="#6fb3bd">ask</text>
    <!-- agent to website: reply -->
    <path d="M336 128H280" stroke="#e8c06a" fill="none" marker-end="url(#g)"/>
    <text x="282" y="148" fill="#e8c06a">reply</text>
    <!-- agent to store: tools -->
    <path d="M456 154V244" stroke="#6fb3bd" fill="none" marker-end="url(#a)"/>
    <text x="468" y="192">tools,</text>
    <text x="468" y="210">every turn</text>
    <!-- cards to store -->
    <path d="M254 176C300 176 300 290 330 290" stroke="#e8c06a" fill="none" marker-end="url(#g)"/>
    <!-- end of chat and fresh data to evaluator -->
    <path d="M150 344V494" stroke="#6fb3bd" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <text x="160" y="425">chat ended</text>
    <path d="M456 380V494" stroke="#6fb3bd" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <text x="466" y="440">fresh facts</text>
  </g>
</svg>
